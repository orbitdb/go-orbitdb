version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      # go-libp2p has an old v6.0.23+incompatible tag from before Go modules.
      # Dependabot takes it for the latest release and the group update fails,
      # so go-libp2p never moves. A real v6 would live at .../go-libp2p/v6.
      - dependency-name: github.com/libp2p/go-libp2p
        versions: [">= 6.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The interop peer tracks @orbitdb/core so a JS release that changes the
  # wire format fails the interop job instead of surprising users.
  - package-ecosystem: npm
    directory: /interop/js-peer
    schedule:
      interval: weekly
    groups:
      js-peer:
        patterns: ["*"]
    ignore:
      # @orbitdb/core 4 is built against Helia 6; with Helia 7 createOrbitDB
      # fails with NotStartedError. Move with @orbitdb/core, not ahead of it.
      - dependency-name: helia
        update-types: ["version-update:semver-major"]
